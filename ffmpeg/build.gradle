plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    defaultConfig {
        compileSdk 34
        minSdk 26
        targetSdk 34

        versionCode 1040
        versionName "1.0.40"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Kotlin
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'com.google.code.gson:gson:2.9.0'

    // File
    implementation group: 'commons-io', name: 'commons-io', version: '2.11.0'

    // Ffmpeg - use local .aar and .jar files because they want to remove remote binaries
    //api 'com.arthenica:ffmpeg-kit-min-gpl:6.0'
    api(files('libs/ffmpeg-kit-min-gpl-6.0.aar'))
    //implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation(files('libs/smart-exception-java-0.2.1.jar'))
    implementation(files('libs/smart-exception-common-0.2.1.jar'))

    // DI
    implementation "io.insert-koin:koin-android:3.1.2"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}